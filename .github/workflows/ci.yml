name: CI

# Pull requests had no checks at all before this: the site's only workflow builds and publishes
# from main, so a change that broke the build or hand-edited a generated page was found after it
# had already merged.
#
# Everything here depends only on files committed in THIS repository, so a red run always names
# something the pull request under review can fix. The staleness check against the code repo's
# canonical environment-variable list deliberately lives elsewhere (env-vars-drift.yml): it
# depends on another repository, which moves on its own schedule.
on:
  pull_request:
  workflow_dispatch:

# Least privilege: grant no permissions by default, escalate per-job
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-generated-docs:
    name: Verify generated docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      # Checks that docs/reference/environment-variables.md is still a generated page (banner
      # intact, one H1), that every cross-link in it resolves to a real page and heading, and that
      # the set of variables documented in Configuration but absent from the canonical list has
      # not grown. No network and no second checkout: only files from this repository.
      - name: Verify environment-variables.md
        run: node scripts/sync-env-vars.mjs --verify

      # The same offline half for the other generated page: banner intact, one H1, every schema
      # link resolving to a section on the page itself, and every operation stating a scope. An
      # operation rendered without one would read as an endpoint that needs no authorization.
      - name: Verify api-reference.md
        run: node scripts/sync-openapi.mjs --verify

  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Fetch full history so VuePress lastUpdated reflects real commit dates, matching the
          # deploy build. A shallow clone here would build a site subtly unlike the published one.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with VuePress
        run: pnpm run docs:build
