# Postgres for the docs-repo local deployment of cat-factory.
#
# This is intentionally separate from cat-factory's own deploy/local compose: it
# listens on host port 5433 (not 5432) and uses its own named volume, so you can run
# this doc-screenshot deployment alongside a "real" local checkout without a port or
# data clash. The orchestrator (backend) and the per-job agent containers are NOT
# defined here — the backend runs as a plain Node process on the host (see
# scripts/start.mjs) and agent jobs are launched on demand by the container runtime.
#
#   docker compose -p catfactory-docs up -d postgres
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: cat
      POSTGRES_PASSWORD: cat
      POSTGRES_DB: catfactory
    ports:
      - '5433:5432'
    volumes:
      - catfactory-docs-pg:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cat -d catfactory']
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  catfactory-docs-pg:
